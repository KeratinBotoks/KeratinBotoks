name: tycoon-bot
services:
  - name: bot
    image: python:3.10-slim
    ports:
      - port: 3000
        http: true
    routes:
      - path: /
    env:
      - name: BOT_TOKEN
        secret: true
      - name: CHANNEL_ID
        optional: true
    build:
      dockerfile: Dockerfile
    instance:
      type: free
    volumes:
      - path: /app/data
        size_gb: 1