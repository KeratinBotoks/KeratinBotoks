[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "tycoon-bot"
version = "1.0.0"
description = "Telegram Tycoon Simulator Game Bot"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "aiogram>=3.0.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "pytz>=2023.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"